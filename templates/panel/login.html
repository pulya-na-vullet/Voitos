{% extends "panel/base.html" %}
{% block title %}Voitos — Панель администратора{% endblock %}
{% block public %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/panel/voitos_logo_04_mono.png" alt="Voitos" class="login-logo">
      <div>
        <h1>Voitos</h1>
        <p class="brand-sub" style="margin:0;">Панель администратора</p>
      </div>
    </div>
    <p class="muted">Войдите, чтобы управлять помощником</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <label>Логин</label>
        <input type="text" name="username" autofocus required>
      </div>
      <div class="form-row">
        <label>Пароль</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
