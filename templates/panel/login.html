{% extends "panel/base.html" %}
{% block title %}Вход — Voitos{% endblock %}
{% block public %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/panel/voitos_logo_04_mono.png" alt="Voitos" class="login-logo">
      <div>
        <h1>Voi<span>tos</span></h1>
        <p class="brand-sub">Панель управления</p>
      </div>
    </div>
    <p class="muted">Вход для администратора и менеджера группы</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <label>Логин</label>
        <input type="text" name="username" autofocus required autocomplete="username" placeholder="Ваш логин">
      </div>
      <div class="form-row">
        <label>Пароль</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
